<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SATURNO - EVM Network Launchpad</title>
    <!-- Ethers.js v6.15.0 fixed -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.15.0/dist/ethers.umd.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0d0d;
            color: #fff;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: #1a1a1a;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            color: #f0b90b;
        }
        .section-title {
            font-size: 18px;
            margin: 24px 0 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #333;
            color: #ccc;
        }
        label {
            display: block;
            margin: 12px 0 4px;
            font-size: 14px;
            color: #aaa;
        }
        input,
        textarea,
        button {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 12px;
            background: #111;
            color: #fff;
            font-size: 16px;
            margin-bottom: 8px;
        }
        button {
            background: #f0b90b;
            color: #000;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 4px;
        }
        button:active {
            transform: scale(0.97);
        }
        button:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .status {
            margin-top: 16px;
            padding: 12px;
            background: #222;
            border-radius: 12px;
            font-size: 14px;
            word-break: break-all;
            min-height: 50px;
        }
        .status .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #888;
            border-top-color: #f0b90b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .success {
            color: #4caf50;
        }
        .error {
            color: #f44336;
        }
        #walletInfo {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 14px;
            text-align: center;
        }
        .network-badge {
            display: inline-block;
            background: #333;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-left: 6px;
        }
        .input-with-copy {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .input-with-copy input {
            flex: 1;
            margin-bottom: 0;
        }
        .copy-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
            margin-top: 0;
            width: auto;
        }
        .copy-btn:active {
            transform: scale(0.95);
            background: #555;
        }
        .copy-btn.copied {
            background: #4caf50;
            border-color: #4caf50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🪐 SATURNO - EVM Network Launchpad</h1>

        <!-- Wallet -->
        <div id="walletInfo">
            <span id="walletStatus">🔌 Connect your wallet</span>
        </div>
        <button id="connectBtn">🔑 Connect MetaMask</button>
        <hr style="margin: 20px 0; border-color: #333;">

        <!-- SECTION 1: CREATE TOKEN -->
        <div class="section-title">📦 Create New Token</div>
        <form id="launchForm">
            <label>Token Name *</label>
            <input type="text" id="tokenName" placeholder="e.g. My Token" required>

            <label>Symbol *</label>
            <input type="text" id="tokenSymbol" placeholder="e.g. MTK" required>

            <label>Total Supply * (without decimals)</label>
            <input type="number" id="tokenSupply" placeholder="1000000" required>

            <label>Description</label>
            <textarea id="description" rows="2" placeholder="Project description"></textarea>

            <label>Logo (URL or IPFS)</label>
            <input type="text" id="logo" placeholder="https://... or ipfs://...">

            <label>Banner (URL or IPFS)</label>
            <input type="text" id="banner" placeholder="https://... or ipfs://...">

            <label>Website</label>
            <input type="text" id="website" placeholder="https://...">

            <label>X (Twitter)</label>
            <input type="text" id="twitter" placeholder="https://x.com/...">

            <label>Telegram</label>
            <input type="text" id="telegram" placeholder="https://t.me/...">

            <label>Whitepaper (URL or IPFS)</label>
            <input type="text" id="whitepaper" placeholder="ipfs://...">

            <label>Categories (comma separated)</label>
            <input type="text" id="categories" placeholder="DeFi, Gaming">

            <button type="submit" id="launchBtn" disabled>🚀 Launch Token</button>
        </form>

        <hr style="margin: 30px 0; border-color: #333;">

        <!-- SECTION 2: ATTACH METADATA TO EXISTING TOKEN -->
        <div class="section-title">🔗 Attach / Update Metadata</div>
        <form id="attachForm">
            <label>Token Address *</label>
            <div class="input-with-copy">
                <input type="text" id="tokenAddress" placeholder="0x..." required>
                <button type="button" class="copy-btn" id="copyAddressBtn" title="Copy address">📋</button>
            </div>

            <label>Metadata URI (ipfs://...) *</label>
            <input type="text" id="metadataURI" placeholder="ipfs://Qm..." required>

            <div style="display: flex; gap: 10px; margin-top: 4px;">
                <button type="button" id="attachBtn" disabled style="flex:1;">🔗 Attach</button>
                <button type="button" id="updateBtn" disabled style="flex:1;">🔄 Update</button>
            </div>
            <p style="font-size: 12px; color: #777; margin-top: 4px;">Only the authorized wallet (admin) can execute these actions.</p>
        </form>

        <!-- Status messages -->
        <div id="status" class="status"></div>
    </div>

    <script>
        // ======= CONFIGURATION =======
        const PINATA_JWT = "your_pinata_jwt";

        // Robinhood Chain (4663) appears first
        const CONTRACT_ADDRESSES = {
            4663: "0x88718b2960D53BB13c6babEd7b284478048A406B", // Robinhood Chain
            1: "0xYourEthereumContract",
            137: "0xYourPolygonContract",
            56: "0xYourBNBContract",
            8453: "0xYourBaseContract",
            42161: "0xYourArbitrumContract",
            10: "0xYourOptimismContract"
        };

        const SUPPORTED_CHAINS = {
            4663: "Robinhood Chain",
            1: 'Ethereum',
            137: 'Polygon',
            56: 'BNB Chain',
            8453: 'Base',
            42161: 'Arbitrum',
            10: 'Optimism'
        };

        const CONTRACT_ABI = [
            "function launch(string memory name_, string memory symbol_, uint256 supply_, string memory metadataURI_) external",
            "function attachMetadata(address token, string memory metadataURI_) external",
            "function updateMetadata(address token, string memory newMetadataURI_) external",
            "function totalProjects() external view returns (uint256)",
            "function getProject(uint256) external view returns (address owner, address token, string metadataURI)",
            "function getMetadata(address token) external view returns (address owner, address token, string metadataURI)",
            "event ProjectLaunched(address indexed token, address indexed owner, string metadataURI)",
            "event MetadataAttached(address indexed token, address indexed owner, string metadataURI)"
        ];

        // ======= DOM =======
        const statusDiv = document.getElementById('status');
        const connectBtn = document.getElementById('connectBtn');
        const launchBtn = document.getElementById('launchBtn');
        const attachBtn = document.getElementById('attachBtn');
        const updateBtn = document.getElementById('updateBtn');
        const walletStatus = document.getElementById('walletStatus');
        const tokenAddressInput = document.getElementById('tokenAddress');
        const metadataURIInput = document.getElementById('metadataURI');
        const copyAddressBtn = document.getElementById('copyAddressBtn');

        // ======= STATE =======
        let signer = null;
        let contract = null;
        let walletAddress = "";
        let currentChainId = null;
        let provider = null;

        // ======= FUNCTIONS =======
        function setStatus(msg, isError = false, showSpinner = false) {
            let html = msg;
            if (showSpinner) html = `<span class="spinner"></span> ${msg}`;
            statusDiv.innerHTML = html;
            statusDiv.className = 'status ' + (isError ? 'error' : 'success');
        }

        function getNetworkName(chainId) {
            return SUPPORTED_CHAINS[chainId] || `Unknown network (${chainId})`;
        }

        function validateForm() {
            const name = document.getElementById('tokenName').value.trim();
            const symbol = document.getElementById('tokenSymbol').value.trim();
            const supply = document.getElementById('tokenSupply').value.trim();

            if (!name) throw new Error('❌ Name is required');
            if (!symbol) throw new Error('❌ Symbol is required');
            if (!supply || isNaN(supply) || Number(supply) <= 0) {
                throw new Error('❌ Supply must be a positive number');
            }

            const urlFields = ['website', 'twitter', 'telegram', 'logo', 'banner', 'whitepaper'];
            for (const field of urlFields) {
                const value = document.getElementById(field).value.trim();
                if (value && !value.match(/^https?:\/\/|^ipfs:\/\//)) {
                    throw new Error(`❌ The "${field}" field must start with http://, https:// or ipfs://`);
                }
            }

            return { name, symbol, supply: Number(supply) };
        }

        function validateAttachForm() {
            const token = tokenAddressInput.value.trim();
            const uri = metadataURIInput.value.trim();
            if (!token || !ethers.isAddress(token)) {
                throw new Error('❌ Invalid token address');
            }
            if (!uri || !uri.startsWith('ipfs://')) {
                throw new Error('❌ URI must start with ipfs://');
            }
            return { token, uri };
        }

        // ======= COPY TO CLIPBOARD =======
        copyAddressBtn.addEventListener('click', async () => {
            const address = tokenAddressInput.value.trim();
            if (!address) {
                setStatus('⚠️ No address to copy', true);
                return;
            }
            try {
                await navigator.clipboard.writeText(address);
                copyAddressBtn.textContent = '✅';
                copyAddressBtn.classList.add('copied');
                setTimeout(() => {
                    copyAddressBtn.textContent = '📋';
                    copyAddressBtn.classList.remove('copied');
                }, 2000);
                setStatus('📋 Address copied to clipboard', false);
            } catch (err) {
                // Fallback for browsers without clipboard API
                const textarea = document.createElement('textarea');
                textarea.value = address;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                copyAddressBtn.textContent = '✅';
                copyAddressBtn.classList.add('copied');
                setTimeout(() => {
                    copyAddressBtn.textContent = '📋';
                    copyAddressBtn.classList.remove('copied');
                }, 2000);
                setStatus('📋 Address copied (alternative method)', false);
            }
        });

        // ======= CONNECT (ETHERS v6) =======
        connectBtn.addEventListener('click', async () => {
            try {
                if (typeof window.ethereum === 'undefined') {
                    throw new Error('❌ MetaMask is not installed. Open this HTML from the MetaMask browser.');
                }

                await window.ethereum.request({ method: 'eth_requestAccounts' });

                // v6: BrowserProvider instead of Web3Provider
                provider = new ethers.BrowserProvider(window.ethereum);
                const network = await provider.getNetwork();
                currentChainId = Number(network.chainId); // v6: chainId is BigInt, convert it

                if (!(currentChainId in CONTRACT_ADDRESSES)) {
                    throw new Error(`❌ Unsupported network (${currentChainId}). Use: ${Object.values(SUPPORTED_CHAINS).join(', ')}`);
                }

                const contractAddress = CONTRACT_ADDRESSES[currentChainId];
                if (!contractAddress) {
                    throw new Error(`❌ No contract deployed on ${getNetworkName(currentChainId)}`);
                }

                // v6: getSigner() returns a promise
                signer = await provider.getSigner();
                walletAddress = await signer.getAddress();
                contract = new ethers.Contract(contractAddress, CONTRACT_ABI, signer);

                walletStatus.innerHTML = `
                    ✅ ${walletAddress.slice(0, 6)}...${walletAddress.slice(-4)}
                    <span class="network-badge">${getNetworkName(currentChainId)}</span>
                `;
                connectBtn.disabled = true;
                launchBtn.disabled = false;
                attachBtn.disabled = false;
                updateBtn.disabled = false;

                setStatus(`✅ Connected to ${getNetworkName(currentChainId)}`, false);

                // Listen for network changes
                window.ethereum.on('chainChanged', (chainIdHex) => {
                    const newChainId = parseInt(chainIdHex, 16);
                    setStatus(`🔄 Network changed to ${getNetworkName(newChainId)}. Reloading...`, false, true);
                    setTimeout(() => window.location.reload(), 1500);
                });

                // Listen for account changes
                window.ethereum.on('accountsChanged', (accounts) => {
                    if (accounts.length === 0) {
                        setStatus('🔌 Wallet disconnected', true);
                        connectBtn.disabled = false;
                        launchBtn.disabled = true;
                        attachBtn.disabled = true;
                        updateBtn.disabled = true;
                        walletStatus.innerText = '🔌 Connect your wallet';
                    } else {
                        window.location.reload();
                    }
                });

            } catch (err) {
                setStatus(err.message, true);
                console.error(err);
            }
        });

        // ======= UPLOAD TO IPFS =======
        async function uploadToIPFS(jsonData) {
            try {
                const formData = new FormData();
                const blob = new Blob([JSON.stringify(jsonData)], { type: 'application/json' });
                formData.append('file', blob, 'metadata.json');

                const response = await fetch('https://api.pinata.cloud/pinning/pinFileToIPFS', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${PINATA_JWT}` },
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.text();
                    throw new Error('Pinata error: ' + error);
                }

                const data = await response.json();
                return `ipfs://${data.IpfsHash}`;
            } catch (err) {
                throw new Error('Error uploading to IPFS: ' + err.message);
            }
        }

        // ======= LAUNCH TOKEN (ETHERS v6) =======
        launchBtn.addEventListener('click', async (e) => {
            e.preventDefault();

            if (!signer) {
                setStatus('❌ Connect your wallet first', true);
                return;
            }

            try {
                launchBtn.disabled = true;
                setStatus('📝 Preparing metadata...', false, true);

                const { name, symbol, supply } = validateForm();

                const metadata = {
                    name,
                    symbol,
                    description: document.getElementById('description').value.trim(),
                    logo: document.getElementById('logo').value.trim(),
                    banner: document.getElementById('banner').value.trim(),
                    website: document.getElementById('website').value.trim(),
                    twitter: document.getElementById('twitter').value.trim(),
                    telegram: document.getElementById('telegram').value.trim(),
                    whitepaper: document.getElementById('whitepaper').value.trim(),
                    categories: document.getElementById('categories').value.split(',').map(s => s.trim()).filter(Boolean),
                    creator: walletAddress,
                    chainId: currentChainId,
                    createdAt: new Date().toISOString()
                };

                setStatus('📤 Uploading metadata to IPFS...', false, true);
                const metadataURI = await uploadToIPFS(metadata);
                setStatus(`📎 URI generated: ${metadataURI}`, false);

                setStatus('⏳ Waiting for signature in your wallet...', false, true);

                // v6: parseUnits without utils.
                const supplyWei = ethers.parseUnits(supply.toString(), 18);
                const tx = await contract.launch(name, symbol, supplyWei, metadataURI);

                setStatus('⛓️ Transaction sent. Confirming on the network...', false, true);
                const receipt = await tx.wait();

                // v6: Get event from parsed logs
                let tokenAddress = '';
                for (const log of receipt.logs) {
                    try {
                        const parsedLog = contract.interface.parseLog(log);
                        if (parsedLog && parsedLog.name === 'ProjectLaunched') {
                            tokenAddress = parsedLog.args.token;
                            break;
                        }
                    } catch (e) { /* ignore logs that are not from the contract */ }
                }

                if (tokenAddress) {
                    tokenAddressInput.value = tokenAddress;
                    setTimeout(() => {
                        tokenAddressInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 300);
                }

                setStatus(`✅ Token launched successfully! TX: ${receipt.hash.slice(0, 20)}...`, false);
                document.getElementById('launchForm').reset();

                if (tokenAddress) {
                    setStatus(`✅ Token launched. Address auto-filled in the "Attach" section. TX: ${receipt.hash.slice(0, 20)}...`, false);
                }

            } catch (err) {
                setStatus('❌ Error: ' + err.message, true);
                console.error(err);
            } finally {
                launchBtn.disabled = false;
            }
        });

        // ======= ATTACH METADATA (ETHERS v6) =======
        attachBtn.addEventListener('click', async () => {
            if (!signer) {
                setStatus('❌ Connect your wallet first', true);
                return;
            }

            try {
                attachBtn.disabled = true;
                setStatus('🔗 Preparing attachment...', false, true);

                const { token, uri } = validateAttachForm();

                setStatus(`⏳ Attaching metadata to token ${token.slice(0, 10)}...`, false, true);
                const tx = await contract.attachMetadata(token, uri);

                setStatus('⛓️ Transaction sent. Confirming...', false, true);
                const receipt = await tx.wait();

                setStatus(`✅ Metadata attached successfully! TX: ${receipt.hash.slice(0, 20)}...`, false);

            } catch (err) {
                setStatus('❌ Error: ' + err.message, true);
                console.error(err);
            } finally {
                attachBtn.disabled = false;
            }
        });

        // ======= UPDATE METADATA (ETHERS v6) =======
        updateBtn.addEventListener('click', async () => {
            if (!signer) {
                setStatus('❌ Connect your wallet first', true);
                return;
            }

            try {
                updateBtn.disabled = true;
                setStatus('🔄 Preparing update...', false, true);

                const { token, uri } = validateAttachForm();

                setStatus(`⏳ Updating metadata for token ${token.slice(0, 10)}...`, false, true);
                const tx = await contract.updateMetadata(token, uri);

                setStatus('⛓️ Transaction sent. Confirming...', false, true);
                const receipt = await tx.wait();

                setStatus(`✅ Metadata updated successfully! TX: ${receipt.hash.slice(0, 20)}...`, false);

            } catch (err) {
                setStatus('❌ Error: ' + err.message, true);
                console.error(err);
            } finally {
                updateBtn.disabled = false;
            }
        });

        // ======= INITIALIZATION =======
        // Set initial message using setStatus function
        setStatus('🪐 SATURNO - EVM Network Launchpad ready. Compatible with all EVM networks. Connect your wallet to start.');
    </script>
</body>
</html>
